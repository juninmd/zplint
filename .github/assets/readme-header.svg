<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="620" viewBox="0 0 1280 620">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#090e1a"/>
      <stop offset="55%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#111c2e"/>
    </linearGradient>
    <radialGradient id="glowEmerald" cx="0.18" cy="0.18" r="0.55">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowOrange" cx="0.86" cy="0.82" r="0.5">
      <stop offset="0%" stop-color="#f97316" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#f97316" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accentBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="50%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
  </defs>

  <!-- Outer Card -->
  <rect width="1280" height="620" rx="22" fill="url(#bg)"/>
  <rect width="1280" height="620" rx="22" fill="url(#glowEmerald)"/>
  <rect width="1280" height="620" rx="22" fill="url(#glowOrange)"/>
  <rect x="1" y="1" width="1278" height="618" rx="21" fill="none" stroke="#1e293b" stroke-width="2"/>
  <rect x="44" y="0" width="1192" height="4" rx="2" fill="url(#accentBar)"/>

  <!-- Header Row -->
  <text x="56" y="76" fill="#f8fafc" font-family="'DejaVu Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="48" font-weight="700" letter-spacing="-1">zplint</text>
  <rect x="218" y="42" width="144" height="34" rx="17" fill="#064e3b" stroke="#10b981" stroke-width="1.2"/>
  <text x="290" y="64" text-anchor="middle" fill="#6ee7b7" font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="14" font-weight="700">v0.6.0 · RUST</text>

  <text x="56" y="114" fill="#94a3b8" font-family="'DejaVu Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="22">
    All-in-One Linter, Formatter, Auto-Fixer, LSP &amp; Compiler for AMX Mod X · CS 1.6 · ZP 5.0
  </text>

  <!-- Stat Pills Row -->
  <g font-family="'DejaVu Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="700">
    <rect x="56" y="138" width="144" height="32" rx="8" fill="#172554" stroke="#3b82f6" stroke-width="1"/>
    <text x="128" y="159" text-anchor="middle" fill="#93c5fd">165 Lint Rules</text>

    <rect x="214" y="138" width="176" height="32" rx="8" fill="#064e3b" stroke="#10b981" stroke-width="1"/>
    <text x="302" y="159" text-anchor="middle" fill="#6ee7b7">1,631 AMXX Natives</text>

    <rect x="404" y="138" width="194" height="32" rx="8" fill="#3b0764" stroke="#a855f7" stroke-width="1"/>
    <text x="501" y="159" text-anchor="middle" fill="#d8b4fe">AMXX 1.10 Compiler</text>

    <rect x="612" y="138" width="174" height="32" rx="8" fill="#431407" stroke="#f97316" stroke-width="1"/>
    <text x="699" y="159" text-anchor="middle" fill="#fdba74">Auto Self-Update</text>

    <rect x="800" y="138" width="176" height="32" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="888" y="159" text-anchor="middle" fill="#cbd5e1">Zero Runtime Deps</text>
  </g>

  <!-- Left Code Editor Pane -->
  <rect x="56" y="196" width="490" height="378" rx="14" fill="#0b1220" stroke="#334155" stroke-width="1.5"/>
  <rect x="56" y="196" width="490" height="40" rx="14" fill="#162033"/>
  <rect x="56" y="222" width="490" height="14" fill="#162033"/>
  <circle cx="80" cy="216" r="6" fill="#ef4444"/>
  <circle cx="100" cy="216" r="6" fill="#f59e0b"/>
  <circle cx="120" cy="216" r="6" fill="#22c55e"/>
  <text x="301" y="221" text-anchor="middle" fill="#94a3b8" font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="14">demo.sma</text>

  <g font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="15">
    <text x="76" y="270" fill="#475569">1</text>
    <text x="108" y="270" fill="#c084fc">#include <tspan fill="#34d399">&lt;amxmodx&gt;</tspan></text>

    <text x="76" y="302" fill="#475569">2</text>

    <text x="76" y="334" fill="#475569">3</text>
    <text x="108" y="334" fill="#60a5fa">public <tspan fill="#f8fafc">plugin_init()</tspan></text>

    <text x="76" y="366" fill="#475569">4</text>
    <text x="108" y="366" fill="#94a3b8">{</text>

    <text x="76" y="398" fill="#475569">5</text>
    <text x="128" y="398" fill="#e2e8f0">register_plugin(<tspan fill="#fde047">"Demo"</tspan>, <tspan fill="#fde047">"1.0"</tspan>, <tspan fill="#fde047">"dev"</tspan>)</text>

    <text x="76" y="434" fill="#475569">6</text>
    <text x="128" y="434" fill="#e2e8f0">set_task(<tspan fill="#fca5a5" font-weight="700">10</tspan>, <tspan fill="#fde047">"tick"</tspan>)</text>
    <line x1="128" y1="440" x2="318" y2="440" stroke="#ef4444" stroke-width="2" stroke-dasharray="4 3"/>

    <text x="76" y="470" fill="#475569">7</text>
    <text x="128" y="470" fill="#60a5fa" xml:space="preserve">new <tspan fill="#e2e8f0">Float:</tspan><tspan fill="#fcd34d" font-weight="700">x</tspan><tspan fill="#e2e8f0"> = 1</tspan></text>
    <line x1="216" y1="476" x2="262" y2="476" stroke="#f59e0b" stroke-width="2" stroke-dasharray="4 3"/>

    <text x="76" y="506" fill="#475569">8</text>
    <text x="128" y="506" fill="#fca5a5" font-weight="700">abort()</text>
    <line x1="128" y1="512" x2="194" y2="512" stroke="#ef4444" stroke-width="2" stroke-dasharray="4 3"/>

    <text x="76" y="542" fill="#475569">9</text>
    <text x="108" y="542" fill="#94a3b8">}</text>
  </g>

  <!-- Right Terminal Diagnostic Pane -->
  <rect x="570" y="196" width="654" height="378" rx="14" fill="#0b1220" stroke="#334155" stroke-width="1.5"/>
  <rect x="570" y="196" width="654" height="40" rx="14" fill="#162033"/>
  <rect x="570" y="222" width="654" height="14" fill="#162033"/>
  <circle cx="594" cy="216" r="6" fill="#ef4444"/>
  <circle cx="614" cy="216" r="6" fill="#f59e0b"/>
  <circle cx="634" cy="216" r="6" fill="#22c55e"/>
  <text x="897" y="221" text-anchor="middle" fill="#94a3b8" font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="14">zplint CLI Output</text>

  <g font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="14">
    <text x="594" y="270" fill="#4ade80">$ <tspan fill="#f8fafc">zplint lint demo.sma</tspan></text>

    <text x="594" y="308" fill="#cbd5e1" text-decoration="underline">demo.sma</text>

    <!-- Diagnostic 1 -->
    <text x="594" y="342" fill="#f87171" font-weight="700">  x L6:</text>
    <text x="662" y="342" fill="#e2e8f0">set_task interval 10 is an integer (warn 213)</text>
    <text x="662" y="362" fill="#94a3b8">runs every frame (~1e-44s) — write 10.0</text>
    <rect x="1014" y="346" width="190" height="22" rx="5" fill="#450a0a" stroke="#ef4444" stroke-width="0.8"/>
    <text x="1109" y="361" text-anchor="middle" fill="#fca5a5" font-size="12" font-weight="700">set_task_int_interval</text>

    <!-- Diagnostic 2 -->
    <text x="594" y="398" fill="#fbbf24" font-weight="700">  ! L7:</text>
    <text x="662" y="398" fill="#e2e8f0">assigned value never used: "x" (warn 204)</text>
    <rect x="1034" y="382" width="170" height="22" rx="5" fill="#451a03" stroke="#f59e0b" stroke-width="0.8"/>
    <text x="1119" y="397" text-anchor="middle" fill="#fde68a" font-size="12" font-weight="700">write_only_symbol</text>

    <!-- Diagnostic 3 -->
    <text x="594" y="438" fill="#f87171" font-weight="700">  x L8:</text>
    <text x="662" y="438" fill="#e2e8f0">abort() causes RTE 1 — use log_error()</text>
    <rect x="1084" y="422" width="120" height="22" rx="5" fill="#450a0a" stroke="#ef4444" stroke-width="0.8"/>
    <text x="1144" y="437" text-anchor="middle" fill="#fca5a5" font-size="12" font-weight="700">abort_call</text>

    <!-- Diagnostic 4 -->
    <text x="594" y="478" fill="#f87171" font-weight="700">  x L8:</text>
    <text x="662" y="478" fill="#e2e8f0">abort() takes >= 1 argument(s), 0 given</text>
    <rect x="1084" y="462" width="120" height="22" rx="5" fill="#450a0a" stroke="#ef4444" stroke-width="0.8"/>
    <text x="1144" y="477" text-anchor="middle" fill="#fca5a5" font-size="12" font-weight="700">api_arity</text>

    <!-- Summary Footer -->
    <line x1="594" y1="504" x2="1204" y2="504" stroke="#1e293b" stroke-width="1.2"/>
    <text x="594" y="532" fill="#f87171" font-weight="700">x 4 issue(s) <tspan fill="#e2e8f0" font-weight="400">(3 error(s), 1 warning(s))</tspan></text>
    <text x="594" y="556" fill="#64748b">  1 file(s) -- 50.82ms  ·  exit code 1</text>
  </g>
</svg>
