<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="480" viewBox="0 0 1280 480">
  <defs>
    <linearGradient id="cardBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="480" rx="20" fill="url(#cardBg)" stroke="#1e293b" stroke-width="2"/>

  <!-- Card 1: Linter & Semantic AST -->
  <g transform="translate(28, 28)">
    <rect width="388" height="200" rx="14" fill="#131c31" stroke="#10b981" stroke-opacity="0.45" stroke-width="1.4"/>
    <rect x="20" y="20" width="44" height="44" rx="10" fill="#064e3b"/>
    <path d="M42 29 L53 34 V43 C53 50 48 55 42 58 C36 55 31 50 31 43 V34 Z" fill="none" stroke="#34d399" stroke-width="2.4" stroke-linejoin="round"/>
    <path d="M37 43 L40.5 46.5 L47.5 39.5" fill="none" stroke="#34d399" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="80" y="40" fill="#f8fafc" font-family="'DejaVu Sans', sans-serif" font-size="19" font-weight="700">Static &amp; AST Linter (165)</text>
    <text x="80" y="61" fill="#6ee7b7" font-family="'DejaVu Sans Mono', monospace" font-size="13">zplint lint · zplint ci</text>
    <text x="20" y="102" fill="#cbd5e1" font-family="'DejaVu Sans', sans-serif" font-size="15">Detects HLDS crashes, tag mismatches,</text>
    <text x="20" y="124" fill="#cbd5e1" font-family="'DejaVu Sans', sans-serif" font-size="15">handle leaks, ZP5.0 bugs, SQLi, and</text>
    <text x="20" y="146" fill="#cbd5e1" font-family="'DejaVu Sans', sans-serif" font-size="15">1,631 natives / 3,194 constants.</text>
    <rect x="20" y="164" width="142" height="22" rx="6" fill="#0f172a"/>
    <text x="91" y="179" text-anchor="middle" fill="#34d399" font-family="'DejaVu Sans Mono', monospace" font-size="12">Rayon Parallel</text>
    <rect x="172" y="164" width="136" height="22" rx="6" fill="#0f172a"/>
    <text x="240" y="179" text-anchor="middle" fill="#94a3b8" font-family="'DejaVu Sans Mono', monospace" font-size="12">Win-1252 Aware</text>
  </g>

  <!-- Card 2: Auto-Fix & Formatter -->
  <g transform="translate(446, 28)">
    <rect width="388" height="200" rx="14" fill="#131c31" stroke="#38bdf8" stroke-opacity="0.45" stroke-width="1.4"/>
    <rect x="20" y="20" width="44" height="44" rx="10" fill="#0c4a6e"/>
    <path d="M34 35 L29 42 L34 49 M50 35 L55 42 L50 49 M44 33 L40 51" fill="none" stroke="#38bdf8" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="80" y="40" fill="#f8fafc" font-family="'DejaVu Sans', sans-serif" font-size="19" font-weight="700">Auto-Fix &amp; Formatter</text>
    <text x="80" y="61" fill="#7dd3fc" font-family="'DejaVu Sans Mono', monospace" font-size="13">zplint fix · zplint fmt</text>
    <text x="20" y="102" fill="#cbd5e1" font-family="'DejaVu Sans', sans-serif" font-size="15">Safe fixes by default (charsmax),</text>
    <text x="20" y="124" fill="#cbd5e1" font-family="'DejaVu Sans', sans-serif" font-size="15">opt-in --unsafe-fixes for ZP checks,</text>
    <text x="20" y="146" fill="#cbd5e1" font-family="'DejaVu Sans', sans-serif" font-size="15">brace indent &amp; #include sorting.</text>
    <rect x="20" y="164" width="128" height="22" rx="6" fill="#0f172a"/>
    <text x="84" y="179" text-anchor="middle" fill="#38bdf8" font-family="'DejaVu Sans Mono', monospace" font-size="12">--check / --write</text>
    <rect x="158" y="164" width="134" height="22" rx="6" fill="#0f172a"/>
    <text x="225" y="179" text-anchor="middle" fill="#94a3b8" font-family="'DejaVu Sans Mono', monospace" font-size="12">100% Safe Mode</text>
  </g>

  <!-- Card 3: Built-in LSP -->
  <g transform="translate(864, 28)">
    <rect width="388" height="200" rx="14" fill="#131c31" stroke="#a855f7" stroke-opacity="0.45" stroke-width="1.4"/>
    <rect x="20" y="20" width="44" height="44" rx="10" fill="#3b0764"/>
    <circle cx="42" cy="42" r="10" fill="none" stroke="#c084fc" stroke-width="2.4"/>
    <path d="M42 29 V32 M42 52 V55 M29 42 H32 M52 42 H55" stroke="#c084fc" stroke-width="2.4" stroke-linecap="round"/>
    <text x="80" y="40" fill="#f8fafc" font-family="'DejaVu Sans', sans-serif" font-size="20" font-weight="700">Editor Language Server</text>
    <text x="80" y="61" fill="#d8b4fe" font-family="'DejaVu Sans Mono', monospace" font-size="13">zplint lsp (stdio)</text>
    <text x="20" y="102" fill="#cbd5e1" font-family="'DejaVu Sans', sans-serif" font-size="15">Real-time diagnostics as you type,</text>
    <text x="20" y="124" fill="#cbd5e1" font-family="'DejaVu Sans', sans-serif" font-size="15">AMXX API hover docs, formatting,</text>
    <text x="20" y="146" fill="#cbd5e1" font-family="'DejaVu Sans', sans-serif" font-size="15">and zplint-ignore quick-fixes.</text>
    <rect x="20" y="164" width="114" height="22" rx="6" fill="#0f172a"/>
    <text x="77" y="179" text-anchor="middle" fill="#c084fc" font-family="'DejaVu Sans Mono', monospace" font-size="12">Neovim / VSC</text>
    <rect x="144" y="164" width="130" height="22" rx="6" fill="#0f172a"/>
    <text x="209" y="179" text-anchor="middle" fill="#94a3b8" font-family="'DejaVu Sans Mono', monospace" font-size="12">Quick Actions</text>
  </g>

  <!-- Card 4: Compiler & Disassembler -->
  <g transform="translate(28, 252)">
    <rect width="388" height="200" rx="14" fill="#131c31" stroke="#f97316" stroke-opacity="0.45" stroke-width="1.4"/>
    <rect x="20" y="20" width="44" height="44" rx="10" fill="#431407"/>
    <rect x="33" y="33" width="18" height="18" rx="3" fill="none" stroke="#fb923c" stroke-width="2.2"/>
    <path d="M38 29 V33 M46 29 V33 M38 51 V55 M46 51 V55 M29 38 H33 M29 46 H33 M51 38 H55 M51 46 H55" stroke="#fb923c" stroke-width="2" stroke-linecap="round"/>
    <text x="80" y="40" fill="#f8fafc" font-family="'DejaVu Sans', sans-serif" font-size="20" font-weight="700">AMXX Compiler &amp; Disasm</text>
    <text x="80" y="61" fill="#fdba74" font-family="'DejaVu Sans Mono', monospace" font-size="13">zplint compile · zplint disasm</text>
    <text x="20" y="102" fill="#cbd5e1" font-family="'DejaVu Sans', sans-serif" font-size="15">Pure-Rust zpc compiler emitting</text>
    <text x="20" y="124" fill="#cbd5e1" font-family="'DejaVu Sans', sans-serif" font-size="15">AMX Mod X 1.10 .amxx binaries plus</text>
    <text x="20" y="146" fill="#cbd5e1" font-family="'DejaVu Sans', sans-serif" font-size="15">normalised bytecode disassembly.</text>
    <rect x="20" y="164" width="124" height="22" rx="6" fill="#0f172a"/>
    <text x="82" y="179" text-anchor="middle" fill="#fb923c" font-family="'DejaVu Sans Mono', monospace" font-size="12">48/48 Official</text>
    <rect x="154" y="164" width="124" height="22" rx="6" fill="#0f172a"/>
    <text x="216" y="179" text-anchor="middle" fill="#94a3b8" font-family="'DejaVu Sans Mono', monospace" font-size="12">ast-compare</text>
  </g>

  <!-- Card 5: CI Reporters & Git Diff -->
  <g transform="translate(446, 252)">
    <rect width="388" height="200" rx="14" fill="#131c31" stroke="#eab308" stroke-opacity="0.45" stroke-width="1.4"/>
    <rect x="20" y="20" width="44" height="44" rx="10" fill="#422006"/>
    <path d="M32 51 V43 M42 51 V34 M52 51 V39" stroke="#facc15" stroke-width="3" stroke-linecap="round"/>
    <text x="80" y="40" fill="#f8fafc" font-family="'DejaVu Sans', sans-serif" font-size="20" font-weight="700">CI Reporters &amp; Git Diff</text>
    <text x="80" y="61" fill="#fde047" font-family="'DejaVu Sans Mono', monospace" font-size="13">--reporter · --changed · --staged</text>
    <text x="20" y="102" fill="#cbd5e1" font-family="'DejaVu Sans', sans-serif" font-size="15">Native SARIF 2.1.0, GitHub Actions,</text>
    <text x="20" y="124" fill="#cbd5e1" font-family="'DejaVu Sans', sans-serif" font-size="15">JUnit XML, and JSON output scoped</text>
    <text x="20" y="146" fill="#cbd5e1" font-family="'DejaVu Sans', sans-serif" font-size="15">to changed or staged .sma files.</text>
    <rect x="20" y="164" width="114" height="22" rx="6" fill="#0f172a"/>
    <text x="77" y="179" text-anchor="middle" fill="#facc15" font-family="'DejaVu Sans Mono', monospace" font-size="12">5 Reporters</text>
    <rect x="144" y="164" width="118" height="22" rx="6" fill="#0f172a"/>
    <text x="203" y="179" text-anchor="middle" fill="#94a3b8" font-family="'DejaVu Sans Mono', monospace" font-size="12">Watch Mode</text>
  </g>

  <!-- Card 6: Auto Self-Update -->
  <g transform="translate(864, 252)">
    <rect width="388" height="200" rx="14" fill="#131c31" stroke="#f43f5e" stroke-opacity="0.45" stroke-width="1.4"/>
    <rect x="20" y="20" width="44" height="44" rx="10" fill="#4c0519"/>
    <path d="M42 30 V48 M35 41 L42 48 L49 41 M33 53 H51" fill="none" stroke="#fb7185" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="80" y="40" fill="#f8fafc" font-family="'DejaVu Sans', sans-serif" font-size="20" font-weight="700">Auto Self-Update</text>
    <text x="80" y="61" fill="#fda4af" font-family="'DejaVu Sans Mono', monospace" font-size="13">[update] auto · self-update</text>
    <text x="20" y="102" fill="#cbd5e1" font-family="'DejaVu Sans', sans-serif" font-size="15">Daily GitHub Release checks with</text>
    <text x="20" y="124" fill="#cbd5e1" font-family="'DejaVu Sans', sans-serif" font-size="15">SHA-256 verification and atomic swap;</text>
    <text x="20" y="146" fill="#cbd5e1" font-family="'DejaVu Sans', sans-serif" font-size="15">skips CI, LSP, and JSON pipes safely.</text>
    <rect x="20" y="164" width="136" height="22" rx="6" fill="#0f172a"/>
    <text x="88" y="179" text-anchor="middle" fill="#fb7185" font-family="'DejaVu Sans Mono', monospace" font-size="12">SHA-256 Verified</text>
    <rect x="166" y="164" width="130" height="22" rx="6" fill="#0f172a"/>
    <text x="231" y="179" text-anchor="middle" fill="#94a3b8" font-family="'DejaVu Sans Mono', monospace" font-size="12">24h Cache Gate</text>
  </g>
</svg>
