[workspace]
members = ["crates/*"]

[package]
name = "zplint"
version = "0.3.0"
edition = "2024"
description = "Lightning-fast linter for Pawn/AMXX (CS 1.6) plugins with Zombie Plague 5.0 support"
authors = ["zplague-addons"]

[dependencies]
clap = { version = "4", features = ["derive"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
termcolor = "1"
walkdir = "2"
notify = { version = "8", features = ["macos_kqueue"] }
anyhow = "1"
rayon = "1"
zpc-amxx = { path = "crates/zpc-amxx" }
zpc-asm = { path = "crates/zpc-asm" }
zpc-ast = { path = "crates/zpc-ast" }
zpc-lex = { path = "crates/zpc-lex" }
zpc-parse = { path = "crates/zpc-parse" }
zpc-codegen = { path = "crates/zpc-codegen" }
zpc-diag = { path = "crates/zpc-diag" }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
